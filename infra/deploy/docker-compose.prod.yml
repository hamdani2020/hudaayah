# Hudaayah production stack — nginx (TLS) + Django (gunicorn) + Postgres + certbot.
#
# This file is version-controlled and run directly from the repo checkout by
# infra/deploy/deploy.sh. Run from the repo root so the relative build contexts
# (./backend, ./infra/nginx) resolve:
#     docker compose -f infra/deploy/docker-compose.prod.yml up -d --build
#
# Config comes from the environment (deploy.sh sources /opt/hudaayah/deploy.env and
# points --env-file at the SSM-derived app.env):
#   SERVER_NAME     public hostname nginx serves (e.g. api.hudaayah.xyz)
#   APP_ENV_FILE    path to the runtime env file built from SSM (default /opt/hudaayah/app.env)

# Fixed project name so the stack is identified as "hudaayah" regardless of the directory
# compose is invoked from (it lives in infra/deploy/, which would otherwise make the
# project "deploy" and orphan the existing hudaayah_* volumes/containers).
name: hudaayah

services:
  db:
    image: postgres:16
    restart: unless-stopped
    # env_file injects POSTGRES_DB/USER/PASSWORD into the container; no compose-level
    # interpolation here (compose resolves ${...} from its own env, not env_file).
    env_file: ${APP_ENV_FILE:-/opt/hudaayah/app.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Probe as the configured role. $$ escapes compose interpolation so the container
      # shell expands POSTGRES_USER/DB (from env_file) at runtime; a bare -U would fall
      # back to OS user "root" and spam FATAL "role root does not exist".
      test: ["CMD-SHELL", "pg_isready -q -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ../../backend
      args:
        REQUIREMENTS: production
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    env_file: ${APP_ENV_FILE:-/opt/hudaayah/app.env}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    # No host port: only nginx reaches gunicorn over the internal compose network.
    expose:
      - "8000"
    volumes:
      # Shared with nginx so it can serve /static/ directly. web's entrypoint runs
      # collectstatic into this path on boot.
      - staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: ../nginx
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:?SERVER_NAME is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - staticfiles:/app/staticfiles:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - web

  # Periodic renewal. deploy.sh handles first issuance explicitly; this loop checks
  # twice daily and is a no-op until a cert is due for renewal.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done'

volumes:
  pgdata:
  staticfiles:
  letsencrypt:
  certbot_www:
