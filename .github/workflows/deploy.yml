name: Deploy backend to EC2

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy on the instance (defaults to the pushed branch)."
        required: false
        type: string

# Required for OIDC: the workflow requests a short-lived token to assume the AWS role.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

env:

  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  deploy:
    name: Roll out via SSM
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check required variables
        run: |
          missing=0
          for v in AWS_REGION AWS_ROLE_ARN EC2_INSTANCE_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::GitHub Actions variable '$v' is not set. Define it under Settings → Secrets and variables → Actions → Variables (from terraform output)."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Resolve deploy ref
        id: ref
        run: echo "ref=${{ inputs.ref || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger deploy on EC2 via SSM
        id: ssm
        env:
          DEPLOY_REF: ${{ steps.ref.outputs.ref }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${DEPLOY_REF}" \
            --parameters "commands=[\"sudo /opt/hudaayah/deploy.sh ${DEPLOY_REF}\"]" \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Dispatched SSM command: $COMMAND_ID"

      - name: Wait for deploy to finish
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          echo "Waiting for SSM command $COMMAND_ID on $EC2_INSTANCE_ID..."
          # The built-in `aws ssm wait command-executed` caps at ~10 min, which is too
          # short for a first deploy that builds the backend + nginx images, pulls
          # certbot, and runs Let's Encrypt issuance. Poll the invocation status
          # ourselves until it leaves the in-flight states, up to ~30 min.
          DEADLINE=$(( $(date +%s) + 1800 ))   # 30 minutes
          STATUS="Pending"
          while :; do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")

            case "$STATUS" in
              Pending|InProgress|Delayed)
                if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                  echo "::warning::Deploy still $STATUS after 30 min — fetching output."
                  break
                fi
                echo "  status=$STATUS — still running, re-checking in 15s..."
                sleep 15
                ;;
              *)
                echo "Deploy reached terminal status: $STATUS"
                break
                ;;
            esac
          done

          echo "----- stdout -----"
          aws ssm get-command-invocation \
            --region "$AWS_REGION" --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" --output text
          echo "----- stderr -----"
          aws ssm get-command-invocation \
            --region "$AWS_REGION" --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardErrorContent" --output text

          echo "Final status: $STATUS"
          [ "$STATUS" = "Success" ]
