name: Deploy backend to EC2

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy on the instance (defaults to the pushed branch)."
        required: false
        type: string

# No default token permissions; the deploy job only needs an OIDC token for AWS.
# The `production` environment must be limited to the `main` branch
# (Settings → Environments → Deployment branches), so only reviewed code deploys.
permissions: {}

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

env:

  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  deploy:
    name: Roll out via SSM
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # OIDC token for aws-actions/configure-aws-credentials

    steps:
      - name: Check required variables
        run: |
          missing=0
          for v in AWS_REGION AWS_ROLE_ARN EC2_INSTANCE_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::GitHub Actions variable '$v' is not set. Define it under Settings → Secrets and variables → Actions → Variables (from terraform output)."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      # The ref ends up inside the shell command run on the EC2 instance, so it is
      # passed via env (never interpolated into the script) and must look like a
      # branch name, tag or commit SHA.
      - name: Resolve deploy ref
        id: ref
        env:
          INPUT_REF: ${{ inputs.ref }}
          DEFAULT_REF: ${{ github.sha }}
        run: |
          ref="${INPUT_REF:-$DEFAULT_REF}"
          if ! printf '%s' "$ref" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$' \
             || printf '%s' "$ref" | grep -q '\.\.'; then
            echo "::error::Invalid deploy ref. Use a branch name, tag or commit SHA."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger deploy on EC2 via SSM
        id: ssm
        env:
          DEPLOY_REF: ${{ steps.ref.outputs.ref }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${DEPLOY_REF}" \
            --parameters "commands=[\"sudo bash -lc 'rm -f /opt/hudaayah/deploy.log; /opt/hudaayah/deploy.sh ${DEPLOY_REF} </dev/null >/opt/hudaayah/deploy.log 2>&1; rc=\$?; tail -n 200 /opt/hudaayah/deploy.log; exit \$rc'\"]" \
            --cloud-watch-output-config "CloudWatchOutputEnabled=true" \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Dispatched SSM command: $COMMAND_ID"

      - name: Wait for deploy to finish
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          echo "Waiting for SSM command $COMMAND_ID on $EC2_INSTANCE_ID..."
          # The built-in `aws ssm wait command-executed` caps at ~10 min, which is too
          # short for a first deploy that builds the backend + nginx images, pulls
          # certbot, and runs Let's Encrypt issuance. Poll the invocation status
          # ourselves until it leaves the in-flight states, up to ~30 min.
          DEADLINE=$(( $(date +%s) + 1800 ))   # 30 minutes
          STATUS="Pending"
          while :; do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")

            case "$STATUS" in
              Pending|InProgress|Delayed)
                if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                  echo "::warning::Deploy still $STATUS after 30 min — fetching output."
                  break
                fi
                echo "  status=$STATUS — still running, re-checking in 15s..."
                sleep 15
                ;;
              *)
                echo "Deploy reached terminal status: $STATUS"
                break
                ;;
            esac
          done

          echo "----- stdout -----"
          aws ssm get-command-invocation \
            --region "$AWS_REGION" --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" --output text
          echo "----- stderr -----"
          aws ssm get-command-invocation \
            --region "$AWS_REGION" --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardErrorContent" --output text

          echo "Final status: $STATUS"
          [ "$STATUS" = "Success" ]
