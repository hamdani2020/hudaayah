name: Deploy backend to EC2

# Deploy-only pipeline. Authenticates to AWS with GitHub OIDC (no stored secrets),
# then triggers the rollout on the EC2 instance over SSM SendCommand. The instance
# pulls the latest source and runs `docker compose up --build` itself — nothing is
# built or pushed from GitHub, and no SSH key is stored.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy on the instance (defaults to the pushed branch)."
        required: false
        type: string

# Required for OIDC: the workflow requests a short-lived token to assume the AWS role.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

env:
  # Non-sensitive deploy targets — set as GitHub Actions *variables* (not secrets),
  # at repo or environment scope, from `terraform output` (envs/production):
  #   AWS_REGION      <- aws_region
  #   AWS_ROLE_ARN    <- deploy_role_arn
  #   EC2_INSTANCE_ID <- ec2_instance_id
  # Define under Settings → Secrets and variables → Actions → Variables, or scope them
  # to the `production` environment used below.
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  deploy:
    name: Roll out via SSM
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check required variables
        run: |
          missing=0
          for v in AWS_REGION AWS_ROLE_ARN EC2_INSTANCE_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::GitHub Actions variable '$v' is not set. Define it under Settings → Secrets and variables → Actions → Variables (from terraform output)."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Resolve deploy ref
        id: ref
        run: echo "ref=${{ inputs.ref || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Debug OIDC token claims
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        run: |
          echo "Role to assume: $AWS_ROLE_ARN"
          echo "Region: $AWS_REGION"
          TOKEN=$(curl -sSL \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')
          # Decode the JWT payload (middle segment) and show the claims we care about.
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          # pad base64url to a multiple of 4
          case $(( ${#PAYLOAD} % 4 )) in 2) PAYLOAD="$PAYLOAD==";; 3) PAYLOAD="$PAYLOAD=";; esac
          echo "$PAYLOAD" | tr '_-' '/+' | base64 -d 2>/dev/null \
            | jq '{iss, aud, sub, repository, ref, environment, event_name}'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger deploy on EC2 via SSM
        id: ssm
        env:
          DEPLOY_REF: ${{ steps.ref.outputs.ref }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${DEPLOY_REF}" \
            --parameters "commands=[\"sudo /opt/hudaayah/deploy.sh ${DEPLOY_REF}\"]" \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Dispatched SSM command: $COMMAND_ID"

      - name: Wait for deploy to finish
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          echo "Waiting for SSM command $COMMAND_ID on $EC2_INSTANCE_ID..."
          if ! aws ssm wait command-executed \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID"; then
            echo "::warning::Deploy command did not reach Success — fetching output."
          fi

          STATUS=$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" --output text)

          echo "----- stdout -----"
          aws ssm get-command-invocation \
            --region "$AWS_REGION" --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" --output text
          echo "----- stderr -----"
          aws ssm get-command-invocation \
            --region "$AWS_REGION" --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardErrorContent" --output text

          echo "Final status: $STATUS"
          [ "$STATUS" = "Success" ]
