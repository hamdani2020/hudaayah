name: CI

# Runs on every pull request into main or develop. Merge to main only when
# "CI passed" is green (required check in branch protection). See docs/ci.md.
#
# Security:
# - `pull_request` only (never `pull_request_target`): PR code runs without secrets
#   and with a read-only token. No secrets are used by this workflow at all.
# - No default token permissions; each job asks for the minimum it needs.
# - Actions are pinned to full commit SHAs (version in the comment, kept current by
#   Dependabot). Checkout does not keep the token in the workspace.

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's changed files
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            backend:
              - "backend/**"
              - "docker-compose.yml"
              - ".github/workflows/ci.yml"
            mobile:
              - "mobile/**"
              - ".github/workflows/ci.yml"

  backend:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Names only, not credentials. The password and Django secret key are
      # generated per run (below), never stored in the repo or in GitHub.
      CI_NETWORK: hudaayah-ci
      CI_DB_HOST: hudaayah-ci-db
      POSTGRES_DB: hudaayah_ci
      POSTGRES_USER: hudaayah_ci
      # Same digest as docker-compose.yml / production.
      POSTGRES_IMAGE: postgres:16@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Generate throwaway credentials for this run
        run: |
          db_password=$(openssl rand -hex 24)
          secret_key=$(openssl rand -hex 32)
          echo "::add-mask::$db_password"
          echo "::add-mask::$secret_key"
          {
            echo "POSTGRES_PASSWORD=$db_password"
            echo "DJANGO_SECRET_KEY=$secret_key"
          } >> "$GITHUB_ENV"

      - name: Start Postgres 16
        run: |
          docker network create "$CI_NETWORK"
          docker run -d --name "$CI_DB_HOST" --network "$CI_NETWORK" \
            -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD \
            "$POSTGRES_IMAGE"
          for _ in $(seq 1 30); do
            if docker exec "$CI_DB_HOST" pg_isready -q -U "$POSTGRES_USER" -d "$POSTGRES_DB"; then
              echo "Postgres is ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::Postgres did not become ready"; docker logs "$CI_DB_HOST"; exit 1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build backend image (development requirements)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          build-args: REQUIREMENTS=development
          tags: hudaayah-backend:ci
          load: true
          cache-from: type=gha,scope=backend
          # Saving the cache is best-effort: some pull_request runs (forks,
          # Dependabot, read-only cache tokens) may only read it. Never fail on that.
          cache-to: type=gha,scope=backend,mode=max,ignore-error=true

      - name: Migrations, checks and tests
        run: |
          # `-e NAME` (no value) passes the variable from the job environment, so the
          # generated values never appear on the command line.
          docker run --rm --network "$CI_NETWORK" \
            -e DJANGO_SETTINGS_MODULE=config.settings.development \
            -e DJANGO_SECRET_KEY \
            -e POSTGRES_HOST="$CI_DB_HOST" -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD \
            hudaayah-backend:ci \
            sh -c "python manage.py makemigrations --check --dry-run \
                   && python manage.py check \
                   && python -m pytest -q"

      - name: Remove the CI database
        if: always()
        run: |
          docker rm -f "$CI_DB_HOST" >/dev/null 2>&1 || true
          docker network rm "$CI_NETWORK" >/dev/null 2>&1 || true

  mobile:
    name: Mobile checks
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Changelog has an entry for the pubspec version
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          if ! jq -e --arg v "$version" \
              '.entries[] | select(.version == $v) | ((.new // []) + (.fixed // [])) | length > 0' \
              assets/changelog.json > /dev/null; then
            echo "::error file=mobile/assets/changelog.json::No release notes for $version. Add an entry to mobile/assets/changelog.json."
            exit 1
          fi
          echo "Changelog entry found for $version"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      # Uses the committed pubspec.lock; fails if it is out of date with pubspec.yaml.
      - run: flutter pub get --enforce-lockfile

      - run: flutter analyze

      - run: flutter test

      - name: Android debug build
        run: flutter build apk --debug

  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, backend, mobile]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: All checks succeeded or were not needed
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.backend.result }} ${{ needs.mobile.result }}
        run: |
          echo "changes/backend/mobile: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A CI job did not pass ($r)."; exit 1 ;;
            esac
          done
