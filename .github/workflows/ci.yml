name: CI

# Runs on every pull request into main or develop. Merge to main only when
# "CI passed" is green (required check in branch protection). See docs/ci.md.
#
# Security:
# - `pull_request` only (never `pull_request_target`): PR code runs without secrets
#   and with a read-only token. No secrets are used by this workflow at all.
# - No default token permissions; each job asks for the minimum it needs.
# - Actions are pinned to full commit SHAs (version in the comment, kept current by
#   Dependabot). Checkout does not keep the token in the workspace.

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  # Weekly full run on the default branch, so newly published vulnerabilities in
  # unchanged dependencies and images are found too.
  schedule:
    - cron: "0 6 * * 1"

permissions: {}

env:
  # Scanners run as containers pinned by digest (no third-party scanner Actions;
  # see docs/ci.md for why Trivy is not used through trivy-action).
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner:v2.7.1@sha256:a70ffffc2bfd33482953e5d6b64c6fcdb30239717a07b0f0d3ab2859ce3e4cde
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  PIP_AUDIT_VERSION: "2.10.1"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's changed files
    # On pull requests only the changed parts run; manual and scheduled runs check
    # everything.
    outputs:
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
      mobile: ${{ github.event_name != 'pull_request' || steps.filter.outputs.mobile == 'true' }}
      images: ${{ github.event_name != 'pull_request' || steps.filter.outputs.images == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            backend:
              - "backend/**"
              - "docker-compose.yml"
              - ".github/workflows/ci.yml"
            mobile:
              - "mobile/**"
              - ".github/workflows/ci.yml"
            images:
              - "backend/**"
              - "infra/nginx/**"
              - "infra/deploy/**"
              - ".trivyignore.yaml"
              - ".github/workflows/ci.yml"

  backend:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Names only, not credentials. The password and Django secret key are
      # generated per run (below), never stored in the repo or in GitHub.
      CI_NETWORK: hudaayah-ci
      CI_DB_HOST: hudaayah-ci-db
      POSTGRES_DB: hudaayah_ci
      POSTGRES_USER: hudaayah_ci
      # Same digest as docker-compose.yml / production.
      POSTGRES_IMAGE: postgres:16@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Generate throwaway credentials for this run
        run: |
          db_password=$(openssl rand -hex 24)
          secret_key=$(openssl rand -hex 32)
          echo "::add-mask::$db_password"
          echo "::add-mask::$secret_key"
          {
            echo "POSTGRES_PASSWORD=$db_password"
            echo "DJANGO_SECRET_KEY=$secret_key"
          } >> "$GITHUB_ENV"

      - name: Start Postgres 16
        run: |
          docker network create "$CI_NETWORK"
          docker run -d --name "$CI_DB_HOST" --network "$CI_NETWORK" \
            -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD \
            "$POSTGRES_IMAGE"
          for _ in $(seq 1 30); do
            if docker exec "$CI_DB_HOST" pg_isready -q -U "$POSTGRES_USER" -d "$POSTGRES_DB"; then
              echo "Postgres is ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::Postgres did not become ready"; docker logs "$CI_DB_HOST"; exit 1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build backend image (development requirements)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          build-args: REQUIREMENTS=development
          tags: hudaayah-backend:ci
          load: true
          cache-from: type=gha,scope=backend
          # Saving the cache is best-effort: some pull_request runs (forks,
          # Dependabot, read-only cache tokens) may only read it. Never fail on that.
          cache-to: type=gha,scope=backend,mode=max,ignore-error=true

      - name: Migrations, checks and tests
        run: |
          # `-e NAME` (no value) passes the variable from the job environment, so the
          # generated values never appear on the command line.
          docker run --rm --network "$CI_NETWORK" \
            -e DJANGO_SETTINGS_MODULE=config.settings.development \
            -e DJANGO_SECRET_KEY \
            -e POSTGRES_HOST="$CI_DB_HOST" -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD \
            hudaayah-backend:ci \
            sh -c "python manage.py makemigrations --check --dry-run \
                   && python manage.py check \
                   && python -m pytest -q"

      # Django's deployment checklist against the real production settings
      # (HTTPS redirect, HSTS, secure cookies, ...). Warnings fail the build.
      - name: Django deploy checks (production settings)
        run: |
          docker run --rm --entrypoint python \
            -e DJANGO_SETTINGS_MODULE=config.settings.production \
            -e DJANGO_SECRET_KEY \
            -e DJANGO_ALLOWED_HOSTS=api.hudaayah.xyz \
            hudaayah-backend:ci \
            manage.py check --deploy --fail-level WARNING

      - name: Remove the CI database
        if: always()
        run: |
          docker rm -f "$CI_DB_HOST" >/dev/null 2>&1 || true
          docker network rm "$CI_NETWORK" >/dev/null 2>&1 || true

  mobile:
    name: Mobile checks
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Changelog has an entry for the pubspec version
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          if ! jq -e --arg v "$version" \
              '.entries[] | select(.version == $v) | ((.new // []) + (.fixed // [])) | length > 0' \
              assets/changelog.json > /dev/null; then
            echo "::error file=mobile/assets/changelog.json::No release notes for $version. Add an entry to mobile/assets/changelog.json."
            exit 1
          fi
          echo "Changelog entry found for $version"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      # Uses the committed pubspec.lock; fails if it is out of date with pubspec.yaml.
      - run: flutter pub get --enforce-lockfile

      - run: flutter analyze

      - run: flutter test

      - name: Android debug build
        run: flutter build apk --debug

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0 # full history, to scan every commit in the PR

      # Pull requests: only the PR's commits. Other runs: the whole history.
      # Rules: gitleaks defaults + .gitleaks.toml (lock-file checksums skipped).
      - name: gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          range=()
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            range=(--log-opts="$BASE_SHA..$HEAD_SHA")
          fi
          # Non-root user: git would then reject the repo as "dubious ownership" and
          # gitleaks would silently scan 0 commits, so mark it as a safe directory.
          set -o pipefail
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -v "$PWD:/repo:ro" -w /repo "$GITLEAKS_IMAGE" \
            git --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1 \
            "${range[@]}" . 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          # Guard against a scan that passes because it scanned nothing.
          if grep -q " 0 commits scanned" "$RUNNER_TEMP/gitleaks.log"; then
            echo "::error::gitleaks scanned 0 commits; the scan did not run."
            exit 1
          fi

  dependencies:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13" # same as backend/Dockerfile

      # Resolves the full dependency tree of the requirement files and checks it
      # against the PyPI / OSV advisory databases.
      - name: pip-audit (backend)
        run: |
          python -m pip install --quiet "pip-audit==$PIP_AUDIT_VERSION"
          pip-audit --progress-spinner off \
            -r backend/requirements/production.txt \
            -r backend/requirements/development.txt

      # Flutter packages and the fastlane gems, from their lock files.
      - name: osv-scanner (pubspec.lock, Gemfile.lock)
        run: |
          docker run --rm -v "$PWD:/src:ro" "$OSV_SCANNER_IMAGE" scan source \
            --lockfile=/src/mobile/pubspec.lock \
            --lockfile=/src/mobile/android/Gemfile.lock

  images:
    name: Image scan
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The images that actually run in production (production requirements only).
      - name: Build production backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          build-args: REQUIREMENTS=production
          tags: hudaayah-backend:prod
          load: true
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,scope=backend-prod,mode=max,ignore-error=true

      - name: Build nginx image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: infra/nginx
          tags: hudaayah-nginx:prod
          load: true
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,scope=nginx,mode=max,ignore-error=true

      # Scanned from tar files: the scanner never gets the Docker socket.
      # Fails on HIGH/CRITICAL vulnerabilities that have a fix available. Accepted
      # exceptions go in .trivyignore.yaml (exact package, statement, expiry date);
      # --show-suppressed lists them in the log so they stay visible.
      - name: Trivy (backend + nginx)
        run: |
          mkdir -p "$RUNNER_TEMP/scan"
          docker save hudaayah-backend:prod -o "$RUNNER_TEMP/scan/backend.tar"
          docker save hudaayah-nginx:prod -o "$RUNNER_TEMP/scan/nginx.tar"
          status=0
          for img in backend nginx; do
            echo "::group::Trivy $img"
            docker run --rm \
              -v "$RUNNER_TEMP/scan:/scan:ro" -v "$PWD/.trivyignore.yaml:/trivyignore.yaml:ro" \
              "$TRIVY_IMAGE" image --input "/scan/$img.tar" \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --ignorefile /trivyignore.yaml --show-suppressed \
              --no-progress --exit-code 1 || status=1
            echo "::endgroup::"
          done
          exit "$status"

  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, backend, mobile, secrets, dependencies, images]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: All checks succeeded or were not needed
        env:
          RESULTS: >-
            ${{ needs.changes.result }} ${{ needs.backend.result }} ${{ needs.mobile.result }}
            ${{ needs.secrets.result }} ${{ needs.dependencies.result }} ${{ needs.images.result }}
        run: |
          echo "changes/backend/mobile/secrets/dependencies/images: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A CI job did not pass ($r)."; exit 1 ;;
            esac
          done
