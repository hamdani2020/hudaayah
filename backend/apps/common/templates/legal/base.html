<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <title>{% block title %}Hudaayah{% endblock %} · Hudaayah</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
           line-height: 1.6; color: #1b1c1a; background: #fbf9f4; margin: 0; }
    main { max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 1.8rem; margin-bottom: .25rem; }
    h2 { font-size: 1.2rem; margin-top: 2rem; }
    a { color: #00573f; }
    nav a { margin-right: 16px; }
    .meta { color: #5c5f5a; font-size: .9rem; }
    footer { margin-top: 3rem; font-size: .85rem; color: #5c5f5a; }
  </style>
</head>
<body>
<main>
  <nav>
    <a href="{% url 'legal-privacy' %}">Privacy Policy</a>
    <a href="{% url 'legal-terms' %}">Terms of Use</a>
    <a href="{% url 'legal-delete-account' %}">Delete account</a>
  </nav>
  {% block content %}{% endblock %}
  <footer>
    Quran content is provided by <a href="https://quran.foundation">Quran Foundation</a>.
    Contact: <a href="mailto:{{ contact_email }}">{{ contact_email }}</a>
  </footer>
</main>
</body>
</html>
